[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-kernel"
version = "0.4.0"
description = "A local project kernel for human-approved agent work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[project.scripts]
state-tree = "kernel.cli:main"
kernel-mcp = "kernel.mcp:main"

[tool.setuptools.packages.find]
include = ["kernel*"]
